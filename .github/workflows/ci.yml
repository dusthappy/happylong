name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile happlylong.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Release check (publish layer hygiene)
        shell: bash
        run: python happlylong.py release-check
      - name: Fresh-clone experience (init auto-detects English)
        shell: bash
        run: |
          python happlylong.py init
          python happlylong.py --session-id ci-main doctor
          python happlylong.py --session-id ci-main status
      - name: Language round trip
        shell: bash
        run: |
          python happlylong.py init --lang en
          python happlylong.py lang zh
          python happlylong.py lang en
      - name: Project, iteration, knowledge lifecycle
        shell: bash
        run: |
          python happlylong.py project new ciproj --title "CI Project"
          python happlylong.py --session-id ci-main iter new ciproj --title "CI sample requirement"
          python happlylong.py iter list ciproj
          python happlylong.py knowledge init --project ciproj
          python happlylong.py --session-id ci-main doctor
      - name: Symlink lifecycle (real links; Windows needs Developer Mode, enabled on GitHub runners)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fakerepo"
          python happlylong.py link add ciproj fakerepo "$RUNNER_TEMP/fakerepo" --role lib
          python happlylong.py link list ciproj
          python happlylong.py link rm ciproj fakerepo
          python happlylong.py --session-id ci-main doctor
